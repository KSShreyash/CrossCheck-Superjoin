name: keep-alive

# A free Render instance sleeps after 15 minutes of no traffic and then takes
# most of a minute to wake. Pinging it keeps a demo responsive.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the deployment
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "DEPLOY_URL variable is not set; nothing to ping."
            exit 0
          fi
          url="${DEPLOY_URL%/}/api/stats"
          # a sleeping instance can take most of a minute to answer
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 60 "$url" || echo 000)
            if [ "$code" = "200" ]; then
              echo "awake: HTTP $code"
              head -c 300 /tmp/body
              exit 0
            fi
            echo "attempt $attempt returned $code, retrying"
            sleep 15
          done
          echo "no healthy response from $url after 5 attempts"
          exit 1
